name: Deploy Portfolio

on:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm install
          npm run build
          
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Run Tests (if any)
        run: echo "No tests to run at the moment"
